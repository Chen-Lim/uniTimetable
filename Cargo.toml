[package]
name = "ischeduler"
version = "0.1.0"
edition = "2021"
description = "USyd timetable iCal restructurer"

[[bin]]
name = "ischeduler"
path = "src/main.rs"

[dependencies]
# HTTP client (blocking, no async needed for MVP)
ureq = "2.10"

# UUID generation
uuid = { version = "1.11", features = ["v4"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Regex
regex = "1.11"

# Chrono for date/time
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
